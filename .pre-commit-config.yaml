repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: Ruff format
        entry: uv run ruff format --check
        language: system
        types_or: [python, pyi]
      - id: ruff-check
        name: Ruff lint
        entry: uv run ruff check
        language: system
        types_or: [python, pyi]
      - id: pyright
        name: Pyright
        entry: uv run pyright
        language: system
        pass_filenames: false
      - id: pytest
        name: Pytest
        entry: uv run pytest --testmon
        language: system
        pass_filenames: false

