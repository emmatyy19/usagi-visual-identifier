name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Install Python and dependencies
        run: uv sync --locked --all-groups

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Validate public collection
        run: uv run python scripts/check_public_shelf.py

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run pyright

      - name: Run tests with coverage
        run: >
          uv run pytest
          --cov=usagi_visual_identifier
          --cov-report=term-missing
          --cov-fail-under=90

      - name: Build package
        run: uv build

      - name: Smoke test built wheel
        run: |
          uv venv --python 3.12 "${RUNNER_TEMP}/usagi-identifier-smoke"
          uv pip install \
            --python "${RUNNER_TEMP}/usagi-identifier-smoke/bin/python" \
            dist/*.whl
          "${RUNNER_TEMP}/usagi-identifier-smoke/bin/python" \
            -c "import usagi_visual_identifier"
