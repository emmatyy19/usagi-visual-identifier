<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="A private personal catalog for my Usagi collection">
    <title>{{ page_title or "Usagi Shelf" }}</title>
    <link rel="icon" href="{{ url_for('static', path='/favicon.svg') }}" type="image/svg+xml">
    <link rel="stylesheet" href="{{ url_for('static', path='/catalog.css') }}">
    <script src="{{ url_for('static', path='/loading.js') }}" defer></script>
  </head>
  <body>
    <div class="page-progress" aria-hidden="true" hidden></div>
    <div class="loading-status" role="status" aria-live="polite" aria-atomic="true" hidden>
      <span class="loading-spinner" aria-hidden="true"></span>
      <span class="loading-message"></span>
    </div>
    <header class="site-header">
      <a class="brand" href="/catalog" aria-label="Usagi Shelf home">
        <span class="brand-mark" aria-hidden="true">🐰</span>
        <span>
          <strong>Usagi Shelf</strong>
          <small>My personal collection</small>
        </span>
      </a>
      <nav aria-label="Main navigation">
        <a class="identify-link" href="/identify">Identify a doll</a>
        <a href="/catalog">Catalog</a>
        <a class="button button-small" href="/catalog/new">Add a doll</a>
      </nav>
    </header>
    <main>{% block content %}{% endblock %}</main>
    <footer>Stored privately on this computer</footer>
  </body>
</html>
